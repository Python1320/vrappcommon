[project]
name = "vrappcommon"
version = "0.1.0"
description = "Shared utilities for VR Python applications"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.11.18",
    "colorama>=0.4.6",
    "openvr>=2.5.102",
    "psutil>=7.0.0",
    "python-osc>=1.9.3",
    "pywin32>=308; sys_platform == 'win32'",
    "tendo>=0.3.0",
    "zeroconf>=0.146.5",
]

[dependency-groups]
dev = [
    "pylance>=4.0.1",
    "pyright>=1.1.409",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.15.12",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff.lint]
ignore = ["W191", "E101"]

[tool.ruff.lint.flake8-quotes]
inline-quotes = "single"

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.format]
quote-style = "single"
indent-style = "tab"
docstring-code-format = true

[tool.ruff.lint.pycodestyle]
max-line-length = 130

[build-system]
requires = ["uv_build>=0.11.2,<0.12.0"]
build-backend = "uv_build"
